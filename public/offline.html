<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keine Verbindung – Wizard Punktezähler</title>
    <style>
      html {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #2a2049 0%, #17111f 60%);
        color: #f1eefc;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .card {
        background: #241b3a;
        border-radius: 16px;
        padding: 1.75rem;
        max-width: 420px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      h1 {
        font-size: 1.3rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #b8aed6;
        margin: 0 0 1.25rem;
        line-height: 1.5;
      }
      button {
        font-size: 1rem;
        border-radius: 10px;
        border: none;
        padding: 0.7rem 1.25rem;
        cursor: pointer;
        font-weight: 600;
        background: #7c5cff;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🧙 Keine Verbindung</h1>
      <p>
        Der Wizard Punktezähler braucht eine Internetverbindung, um Spielstände
        zu laden und zu synchronisieren. Sobald du wieder online bist, einfach
        erneut versuchen.
      </p>
      <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </div>
  </body>
</html>
